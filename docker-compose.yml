services:
  backend:
    # 优先使用 ghcr.io 上的 CI 构建镜像；本地开发可用 --build 现场构建
    image: ghcr.io/sundys/market-quotes-backend:latest
    build:
      context: ./server
    container_name: market-quotes-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # 统一容器时区为中国标准时间，保证"更新于"时间与市场开闭市判断正确
      - TZ=Asia/Shanghai
    volumes:
      # 行情磁盘缓存快照，容器重建不丢最近数据
      - market_cache:/data

volumes:
  market_cache:
