name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    name: Build release APK (armv7 + arm64, split)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 可选：配置了 KEYSTORE_BASE64 等 Secrets 时还原正式签名；
      # 未配置时回退 debug 签名（可安装测试，但不能上架）。
      - name: Restore release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/upload-keystore.jks
            cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            # 快速校验 Secrets 正确性，失败时给出明确报错而不是在 Gradle 深处失败
            keytool -list -keystore app/android/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
              || { echo "::error::签名 Secrets 校验失败：请检查 KEYSTORE_BASE64 是否为 'base64 -w0 upload-keystore.jks' 的完整输出、密码和别名是否正确"; exit 1; }
            echo "release signing configured and verified"
          else
            echo "KEYSTORE_BASE64 not set; release APK will be debug-signed"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # 只编译 armv7 与 arm64 两个 ABI，按架构拆分出独立 APK
      - name: Build release APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: market-quotes-release-arm64-v8a
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: market-quotes-release-armeabi-v7a
          path: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
