name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-android.yml"
    tags:
      - "v*"

# 发布 Release 需要写 contents 权限（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  build:
    name: Build release APK (armv7 + arm64, split)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉取完整历史以读取 tag 上的更新摘要
          fetch-depth: 0

      # 可选：配置了 KEYSTORE_BASE64 等 Secrets 时还原正式签名；
      # 未配置时回退 debug 签名（可安装测试，但不能上架）。
      - name: Restore release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/upload-keystore.jks
            cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            # 快速校验 Secrets 正确性，失败时给出明确报错而不是在 Gradle 深处失败
            keytool -list -keystore app/android/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
              || { echo "::error::签名 Secrets 校验失败：请检查 KEYSTORE_BASE64 是否为 'base64 -w0 upload-keystore.jks' 的完整输出、密码和别名是否正确"; exit 1; }
            echo "release signing configured and verified"
          else
            echo "KEYSTORE_BASE64 not set; release APK will be debug-signed"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # 只编译 armv7 与 arm64 两个 ABI，按架构拆分出独立 APK；
      # tag 触发时版本号自动取 tag 名（去掉 v 前缀），与发布版本永远一致
      - name: Build release APKs
        working-directory: app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build apk --release --split-per-abi \
              --target-platform android-arm,android-arm64 \
              --build-name="${GITHUB_REF_NAME#v}" --build-number="${GITHUB_RUN_NUMBER}"
          else
            flutter build apk --release --split-per-abi \
              --target-platform android-arm,android-arm64 \
              --build-number="${GITHUB_RUN_NUMBER}"
          fi

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-quotes-release-arm64-v8a
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armv7 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-quotes-release-armeabi-v7a
          path: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      # 推送 v* tag 时：创建 GitHub Release，正文取 tag 注释（中文更新摘要），并附上两个 APK
      #
      # 注意：actions/checkout 可能把标签按 commit 取回（本地变成轻量标签），
      # 此时 `git tag -l --format='%(contents)'` 只能拿到提交信息，
      # 所以这里直接向 GitHub API 读取 tag 对象；没有注释的轻量标签回退到提交信息。
      - name: Extract release notes from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" 2>/dev/null || echo '{}')
          obj_type=$(printf '%s' "$ref_json" | jq -r '.object.type // ""')
          tag_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha // ""')

          notes=""
          if [ "$obj_type" = "tag" ] && [ -n "$tag_sha" ]; then
            notes=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.message' 2>/dev/null || true)
          fi

          if [ -z "$notes" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} 没有注释，改用提交信息作为 Release 正文"
            notes=$(git log -1 --pretty=%B)
          fi

          printf '%s\n' "$notes" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          fail_on_unmatched_files: true
